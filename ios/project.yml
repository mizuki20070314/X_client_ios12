name: XRelayClient
options:
  bundleIdPrefix: com.mizuki20070314
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"

targets:
  XRelayClient:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: XRelayClient/App
      - path: XRelayClient/Core
      - path: XRelayClient/UI
      - path: XRelayClient/Resources
    info:
      path: XRelayClient/Info.plist
      properties:
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleName: XRelayClient
        CFBundlePackageType: APPL
        CFBundleDisplayName: X Relay Client
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ja
        UILaunchStoryboardName: LaunchScreen
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "設定したXリレーサーバーへ接続するため、ローカルネットワークを使用します。"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizuki20070314.XRelayClient
        PRODUCT_NAME: XRelayClient
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        # iOS 12.0/12.1 have no Swift runtime in the OS: always bundle the Swift libraries.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"

schemes:
  XRelayClient:
    build:
      targets:
        XRelayClient: all
