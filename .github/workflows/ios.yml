name: iOS client

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios/**"
      - "sakura/**"
      - "tools/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "sakura/**"
      - "tools/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE: /Applications/Xcode_16.4.app

jobs:
  build-and-simulator-smoke-test:
    name: Build and simulator smoke test
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Python CGI
        run: |
          python3 -m py_compile sakura/www/cgi-bin/xrelay.cgi sakura/setup_config.py
          python3 -m unittest discover -s sakura/tests -v

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/XRelayClient.xcodeproj \
            -scheme XRelayClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"

      - name: Show simulator compiler errors
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/simulator-build.log" | sort -u | head -100 || true

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/XRelayClient.xcodeproj \
            -scheme XRelayClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/device-build.log"

      - name: Show device compiler errors
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/device-build.log" | sort -u | head -100 || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DeviceDerivedData/Build/Products/Release-iphoneos/XRelayClient.app"
          test -d "$app_path"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/ipa/Payload/"
          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry "$RUNNER_TEMP/XRelayClient-unsigned.ipa" Payload
          )
          # grep -c reads the whole listing; grep -q would stop early and fail the pipe with SIGPIPE
          test "$(unzip -Z1 "$RUNNER_TEMP/XRelayClient-unsigned.ipa" | grep -c '^Payload/XRelayClient\.app/')" -gt 0

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: XRelayClient-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/XRelayClient-unsigned.ipa

      - name: Boot simulator (iPhone SE, 3rd generation)
        run: |
          set -euo pipefail
          # sed rather than head: head would close the pipe early and make grep fail with SIGPIPE
          device_udid="$(xcrun simctl list devices available | grep -F "iPhone SE (3rd generation) (" | sed -n '1p' | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")"
          test -n "$device_udid"
          echo "SIMULATOR_UDID=$device_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$device_udid" -b

      - name: Take screenshots
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/XRelayClient.app"
          test -d "$app_path"
          bash tools/ci_screenshots.sh "$app_path" "$SIMULATOR_UDID"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crash
          cp ~/Library/Logs/DiagnosticReports/XRelayClient* shots/crash/ 2>/dev/null || true
          ls shots/crash || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
